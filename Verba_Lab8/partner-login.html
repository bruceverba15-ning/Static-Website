<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Portal Login - Kulturang Pinoy</title>
    <link rel="stylesheet" href="partner-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" id="partnerLoginPage">
        <div class="box">
            <form class="login-form" onsubmit="return validatePartnerLogin()">
                <h2>Partner Portal Login</h2>
                <p class="subtext">Gamitin ang iyong Kulturang Pinoy account.</p>
                <input type="text" id="partner-username" placeholder="Username" required>
                <input type="password" id="partner-password" placeholder="Password" required>
                <button type="submit">Log In</button>
                <p id="partner-error-message" class="error-message"></p>
            </form>
             <p class="back-link" style="margin-top: 15px; font-size: 0.9em;">
                <a href="about.html" style="color: #c85a34; text-decoration: none;">Bumalik sa About Page</a>
            </p>
        </div>
    </div>

    <script src="partner-script.js"></script>
</body>
</html>
